# DANet Model Configuration

# Architecture
model: 'DANet-L/16'
conditional: true
img_size: 256
img_height: 352
img_width: 720
attn_dropout: 0.0
proj_dropout: 0.0
n_depth_levels: 1024
use_mask_as_channel: true  # Whether to add mask as an extra channel to the input
argo_fusion_method: 'geo_fusion' # 'crossattention' or 'geo_fusion'
patch_embed_method: 'standard' # 'standard', 'fibonacci', 'simple_fibonacci', 'simple_fibonacci_v2'
fibonacci_n: 1024        # Number of points/patches for Fibonacci sphere
fibonacci_pos_embed_type: 'fourier' # 'fourier' or 'mlp' for Fibonacci position embedding
zero_land_output: true
use_time_embed: false  # Whether to use cyclical time (date) embedding as additional conditioning

# Training
epochs: 200
warmup_epochs: 1
batch_size: 14
lr:  # Learning rate (absolute), null means calculated from blr
blr: 5.0e-5  # Base learning rate: absolute_lr = base_lr * total_batch_size / 256
min_lr: 0.0  # Minimum LR for cyclic schedulers that hit 0
lr_schedule: 'constant'
weight_decay: 0.0
ema_decay1: 0.9999  # The first ema to track
ema_decay2: 0.9996  # The second ema to track
P_mean: -0.8
P_std: 0.8
noise_scale: 1.0
t_eps: 0.05

grad_loss_weight: 0.0  # Weight for velocity gradient matching loss. Set to 0.0 to disable.

seed: 0
start_epoch: 0
num_workers: 12
pin_mem: true

# Sampling
evaluate_gen: true  # Set to true for sampling mode
sampling_dataset: 'cal'  # Dataset to use for sampling: 'train', 'cal', or 'test'
sampling_method: 'heun'  # ODE sampling method
num_sampling_steps: 50
num_images: 100
num_samples_per_input: 10
eval_freq: 40  # Frequency (in epochs) for evaluation
online_eval: false
gen_bsz: 32  # Generation batch size
val_sample_ratio: 1.0 # Ratio of validation set to use for sampling (0.0 to 1.0)
val_sample_seed: 42   # Seed for random sampling of validation set
resume_sampling_dir: null  # Path to previous incomplete sampling run directory. Set to null to disable resume sampling

# Classifier-Free Guidance (CFG)
cfg_scale: 1.0  # CFG guidance scale for sampling (1.0 = no guidance, higher = stronger guidance)
cfg_dropout_prob: 0.1  # Probability of dropping conditions during training (0.0 = no dropout)

# Dataset
data_path: './data/glorys12'
argo_file: './data/argo/argo_profiles_by_date'
argo_days: 5  # Number of days to read Argo data (any odd number, e.g., 1, 3, 5, 7, ...)
max_argo_profiles_per_day:  # Maximum number of Argo profiles per day (total limit = this * argo_days)
normalization_method: 'zscore'  # 'minmax', 'quantile', or 'zscore'
velocity_weight: 0.1  # Weight for velocity variables (uo, vo) during z-score standardization

# Checkpointing
output_dir: './output/results'  # Base output directory for checkpoints and logs
resume: null  # Folder that contains checkpoint to resume from. Set to null for fresh training.
checkpoint_name: null  # Specific checkpoint file to load (e.g., 'checkpoint-49.pth'). Set to null for fresh training.
run_prefix: null  # Custom prefix for output directory. null means auto: 'sample' for sampling, 'run' for training.
save_checkpoint_freq: 10
log_freq: 100
device: 'cuda'

# Distributed training
world_size: 4
local_rank: -1
dist_on_itp: false
dist_url: 'env://'
